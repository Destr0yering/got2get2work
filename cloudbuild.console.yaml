steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.console
      - -t
      - ${_IMAGE}
      - --build-arg
      - EXPO_PUBLIC_API_BASE_URL=${_WORKER_API_URL}
      - --build-arg
      - EXPO_PUBLIC_ADMIN_API_BASE_URL=${_ADMIN_API_URL}
      - --build-arg
      - EXPO_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - EXPO_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg
      - EXPO_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - .
images:
  - ${_IMAGE}
